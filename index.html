<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>자유의 여신상 · Anamorphic 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1828;color:#f7fbff;font-family:system-ui,'Malgun Gothic',sans-serif}header{text-align:center;padding:14px 8px 10px}h1{font-size:clamp(20px,4vw,30px);margin:0 0 4px}header p{font-size:13px;color:#a8cbe8;margin:0}.wrap{max-width:1100px;margin:auto;padding:0 10px 18px}.stage{height:min(65vh,680px);min-height:320px;position:relative;overflow:hidden;border:1px solid #406181;border-radius:14px;background:radial-gradient(circle at 25% 25%,#24415b,#0a1422);touch-action:none}.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.stage.camera video{display:block}.composition{position:absolute;left:50%;top:51%;width:min(94%,1000px);aspect-ratio:1487/880;transform:translate(-50%,-50%);transform-origin:center;touch-action:none;will-change:transform}.phone{position:absolute;width:100%;height:100%;inset:0;object-fit:contain;pointer-events:none}.statue{position:absolute;width:76%;height:auto;left:-2%;top:-31%;transform-origin:49% 100%;pointer-events:none;filter:drop-shadow(5px 12px 9px rgba(0,0,0,.38));opacity:0;transform:translate(12%,32%) scale(.34)}.statue.ready{opacity:1;transform:translate(0,0) scale(1)}.statue.animate{animation:emerge 5.5s cubic-bezier(.2,.75,.15,1) forwards}@keyframes emerge{0%{opacity:0;transform:translate(15%,37%) scale(.3);filter:blur(3px)}20%{opacity:1}65%{transform:translate(3%,6%) scale(.85)}100%{opacity:1;transform:translate(0,0) scale(1)}}.status{position:absolute;left:10px;top:10px;padding:7px 10px;border-radius:8px;background:#061629c9;font-size:12px;pointer-events:none}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px auto}.controls button{border:1px solid #7395b3;border-radius:9px;background:#294d6b;color:white;font-size:15px;padding:12px 14px;cursor:pointer;min-height:44px}.controls button:active{background:#407399}.note{text-align:center;color:#b4cee3;font-size:12px;line-height:1.6;margin:8px 0}.camera .composition{filter:drop-shadow(0 10px 8px #0006)}@media(max-width:600px){header{padding:10px 5px}h1{font-size:21px}.stage{height:55dvh;min-height:330px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.controls button{padding:10px 3px;font-size:12px}.statue{width:76%}}
</style></head><body><header><h1>🗽 자유의 여신상 · Anamorphic 3D</h1><p>카메라 합성 · 화면 밖 돌출 애니메이션 · 손가락 이동/회전/확대</p></header><main class="wrap"><section class="stage" id="stage"><video id="video" autoplay muted playsinline></video><div class="composition" id="composition"><img class="phone" src="liberty-background.png" alt="뉴욕 항구가 표시된 스마트폰"><img class="statue" id="statue" src="liberty-statue-transparent.png" alt="횃불을 내미는 자유의 여신상"></div><div class="status" id="status">▶ 돌출 애니메이션 시작을 눌러 주세요</div></section><div class="controls"><button id="play">▶ 돌출 시작</button><button id="resetAnim">↻ 다시 보기</button><button id="camera">📷 카메라 켜기</button><button id="place">📍 위치 배치</button><button id="plus">＋ 확대</button><button id="minus">－ 축소</button><button id="reset">처음 위치</button></div><p class="note">한 손가락: 전체 이동 · 두 손가락: 확대/축소 및 회전 · 카메라 실행 후 [위치 배치]를 누르고 화면을 터치하세요.<br>※ 실제 공간 추적 AR이 아닌 카메라 영상 위 2.5D 이미지 합성 체험입니다.</p></main>
<script>
const stage=document.getElementById('stage'),composition=document.getElementById('composition'),statue=document.getElementById('statue'),video=document.getElementById('video'),status=document.getElementById('status');let stream=null,placing=false,tx=0,ty=0,scale=1,angle=0;const pointers=new Map();let gesture=null;
function update(){composition.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(${angle}deg) scale(${scale})`}
function replay(){statue.classList.remove('ready','animate');void statue.offsetWidth;statue.classList.add('animate');status.textContent='자유의 여신상이 화면 밖으로 돌출 중…';clearTimeout(replay.timer);replay.timer=setTimeout(()=>{statue.classList.remove('animate');statue.classList.add('ready');status.textContent='완료 · 다시 보기로 재생'},5550)}
document.getElementById('play').onclick=replay;document.getElementById('resetAnim').onclick=replay;
document.getElementById('camera').onclick=async e=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;stage.classList.remove('camera');e.target.textContent='📷 카메라 켜기';status.textContent='카메라 종료';return}try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 환경과 카메라 지원 브라우저가 필요합니다.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();stage.classList.add('camera');e.target.textContent='📷 카메라 끄기';status.textContent='카메라 실행 중 · 위치 배치를 누르세요';if(!statue.classList.contains('ready'))replay()}catch(err){status.textContent='카메라 오류: '+err.message;alert('카메라를 시작하지 못했습니다. 브라우저 카메라 권한과 HTTPS 연결을 확인하세요.\n'+err.message)}};
document.getElementById('place').onclick=()=>{placing=true;status.textContent='배치할 위치를 화면에서 터치하세요'};document.getElementById('plus').onclick=()=>{scale=Math.min(3,scale*1.15);update()};document.getElementById('minus').onclick=()=>{scale=Math.max(.25,scale/1.15);update()};document.getElementById('reset').onclick=()=>{tx=ty=angle=0;scale=1;update();replay()};
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function bearing(a,b){return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}function center(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(placing){const r=stage.getBoundingClientRect();tx=e.clientX-(r.left+r.width/2);ty=e.clientY-(r.top+r.height*.51);placing=false;update();status.textContent='위치 배치 완료 · 손가락으로 조작하세요'}gesture=null});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...pointers.values()];if(pts.length===1){tx+=e.clientX-prev.x;ty+=e.clientY-prev.y;update()}else if(pts.length===2){const [a,b]=pts;const d=distance(a,b),ang=bearing(a,b),c=center(a,b);if(gesture){scale=Math.max(.25,Math.min(3,gesture.scale*d/gesture.distance));angle=gesture.angle+ang-gesture.bearing;tx=gesture.tx+c.x-gesture.cx;ty=gesture.ty+c.y-gesture.cy;update()}else gesture={scale,angle,tx,ty,distance:d,bearing:ang,cx:c.x,cy:c.y}}});function end(e){pointers.delete(e.pointerId);gesture=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));update();
</script></body></html>
